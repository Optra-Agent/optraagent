name: optra-staging

services:
  db:
    image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: optra_staging_admin
      POSTGRES_PASSWORD: ${OPTRA_STAGING_DB_ADMIN_PASSWORD:?Set a unique OPTRA staging PostgreSQL admin password}
      OPTRA_STAGING_APP_PASSWORD: ${OPTRA_STAGING_APP_PASSWORD:?Set a unique OPTRA staging application password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/001-app-role.sh:/docker-entrypoint-initdb.d/001-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - data

  app:
    image: ${OPTRA_IMAGE:?Set OPTRA_IMAGE to a published immutable GHCR image}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      APP_BASE_URL: ${APP_BASE_URL:?Set the canonical HTTPS staging origin}
      DATABASE_URL: postgresql://optra_staging_app:${OPTRA_STAGING_APP_PASSWORD:?Set a unique OPTRA staging application password}@db:5432/optra_staging
      CRON_SECRET: ${CRON_SECRET:?Set a unique scheduler secret of at least 32 characters}
      LIVE_TRADING_ENABLED: "false"
      V4_CLAIM_LEVEL: L0
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      proxy:
        aliases:
          - optra-staging-app
      data: {}

volumes:
  pgdata: {}

networks:
  proxy:
    external: true
    name: ${OPTRA_PROXY_NETWORK:?Set OPTRA_PROXY_NETWORK to the live-verified reverse-proxy network}
  data:
    internal: true
