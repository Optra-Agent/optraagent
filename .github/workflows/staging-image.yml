name: OPTRA staging image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full 40-character commit SHA on main to validate and publish
        required: false
        type: string
      publish:
        description: Request GHCR publication after owner approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: optra-staging-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate source and staging image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      validated_sha: ${{ steps.revision.outputs.sha }}
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
        env:
          POSTGRES_DB: optra_ci
          POSTGRES_USER: optra_ci
          POSTGRES_PASSWORD: optra_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U optra_ci -d optra_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LIVE_TRADING_ENABLED: "false"
      V4_CLAIM_LEVEL: L0
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select and verify release commit when requested
        id: revision
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$PUBLISH_REQUESTED" == "true" ]]; then
            if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "A full lowercase 40-character release_commit is required for publication." >&2
              exit 1
            fi
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$RELEASE_COMMIT" FETCH_HEAD; then
              echo "The release commit is not reachable from origin/main." >&2
              exit 1
            fi
            git checkout --detach "$RELEASE_COMMIT"
            sha="$RELEASE_COMMIT"
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'Validating commit %s\n' "$sha"

      - name: Set up Node.js 26.12.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Apply PostgreSQL migrations twice
        env:
          DATABASE_URL: postgresql://optra_ci:optra_ci_only@127.0.0.1:5432/optra_ci
        run: |
          bun run db:migrate
          bun run db:migrate

      - name: Verify PostgreSQL persistence and scheduler lock
        env:
          OPTRA_TEST_POSTGRES_URL: postgresql://optra_ci:optra_ci_only@127.0.0.1:5432/optra_ci
        run: bun run test -- tests/db/postgres-paper-persistence.test.ts tests/db/postgres-scheduler-lock.test.ts

      - name: Install Chromium for isolated browser tests
        run: bun x playwright install --with-deps chromium

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run unit and integration tests
        run: bun run test

      - name: Run isolated browser regression
        run: bun run test:e2e

      - name: Build Next.js production output
        env:
          OPTRA_E2E_DIST_DIR: .local/optra-ci-build
          APP_BASE_URL: https://optra-ci.invalid
          CRON_SECRET: ci-only-paper-scheduler-secret-not-used-outside-this-run
        run: bun run build

      - name: Validate staging Compose configuration
        run: docker compose --env-file deploy/staging/.env.example --file deploy/staging/compose.yml config --quiet

      - name: Build the pinned production image
        env:
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${RELEASE_SHA}" \
            --tag "optra-staging-ci:${RELEASE_SHA}" .

      - name: Smoke-test readiness and scheduler authentication
        env:
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
          CI_CRON_SECRET: ci-only-paper-scheduler-secret-not-used-outside-this-run
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --network host \
            --env NODE_ENV=production \
            --env APP_BASE_URL=https://optra-ci.invalid \
            --env DATABASE_URL=postgresql://optra_ci:optra_ci_only@127.0.0.1:5432/optra_ci \
            --env CRON_SECRET="$CI_CRON_SECRET" \
            --env LIVE_TRADING_ENABLED=false \
            --env V4_CLAIM_LEVEL=L0 \
            "optra-staging-ci:${RELEASE_SHA}")"
          cleanup() { docker rm --force "$container_id" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:3000/api/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            docker logs "$container_id"
            echo "The image did not become ready against the disposable PostgreSQL service." >&2
            exit 1
          fi
          curl --silent --show-error --fail http://127.0.0.1:3000/api/health/live >/dev/null

          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST http://127.0.0.1:3000/api/cron/paper-evaluations \
            --header 'Authorization: Bearer CI_TEST_INVALID')"
          if [[ "$status" != 401 ]]; then
            echo "Expected unauthenticated scheduler request to return 401, received $status." >&2
            exit 1
          fi

  publish-ghcr:
    name: Publish reviewed image to GHCR
    needs: validate-and-build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.publish == true &&
      vars.OPTRA_GHCR_PUBLISH_ENABLED == 'true' &&
      needs.validate-and-build.outputs.validated_sha == inputs.release_commit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: optra-ghcr-publish
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the exact validated release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-and-build.outputs.validated_sha }}
          fetch-depth: 0

      - name: Recheck release commit ancestry
        env:
          RELEASE_COMMIT: ${{ needs.validate-and-build.outputs.validated_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_COMMIT" FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

      - name: Build release image from validated commit
        env:
          RELEASE_COMMIT: ${{ needs.validate-and-build.outputs.validated_sha }}
        run: |
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${RELEASE_COMMIT}" \
            --tag "ghcr.io/optra-agent/optraagent:sha-${RELEASE_COMMIT}" .

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an existing full-SHA registry tag
        env:
          RELEASE_COMMIT: ${{ needs.validate-and-build.outputs.validated_sha }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/optra-agent/optraagent:sha-${RELEASE_COMMIT}"
          if output="$(docker manifest inspect "$image" 2>&1)"; then
            echo "Refusing to overwrite existing image tag $image." >&2
            exit 1
          elif ! grep --ignore-case --extended-regexp --quiet 'not found|manifest unknown|no such manifest' <<< "$output"; then
            printf '%s\n' "$output" >&2
            echo "Could not establish that the GHCR tag is absent; refusing to publish." >&2
            exit 1
          fi

      - name: Publish exact-SHA commit tag
        env:
          RELEASE_COMMIT: ${{ needs.validate-and-build.outputs.validated_sha }}
        run: docker push "ghcr.io/optra-agent/optraagent:sha-${RELEASE_COMMIT}"
